name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  # Base images drift without a commit, so check the pin on a schedule too.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.0.4
        with:
          node-version: '24'
          cache: npm
      # The lockfile is the source of truth: `npm ci` fails if it disagrees with
      # package.json, which is what keeps the pinned tree reproducible.
      - name: Install pinned dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Audit pinned tree
        run: npm audit --omit=dev --audit-level=high

  quadlet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.1
      # Validate the units against a real quadlet generator. --dryrun only prints
      # the generated units, it does not start anything.
      - name: Validate Quadlet units
        run: |
          mkdir -p ~/.config/containers/systemd
          cp quadlet/*.container quadlet/*.volume ~/.config/containers/systemd/
          # Capture the generator's real output and exit status. Piping through
          # grep (with `|| true`) used to swallow a generator failure whose
          # message happened to lack "unsupported"/"error".
          out=$(/usr/libexec/podman/quadlet --user --dryrun 2>&1); rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::quadlet generator exited $rc"; echo "$out"; exit 1
          fi
          if printf '%s' "$out" | grep -qiE 'unsupported|error'; then
            echo "::error::quadlet generator reported a problem"; echo "$out"; exit 1
          fi
          echo "quadlet units OK"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.1
      - name: shellcheck
        run: shellcheck -x scripts/*.sh
      - name: hadolint Containerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Containerfile

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.1
        with:
          fetch-depth: 0
      # Fails on any API key, token, or private key committed to history.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [supply-chain, quadlet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.1
      # GitHub's runners have docker, not podman; the Containerfile is portable.
      - name: Build image
        run: make build PODMAN=docker IMAGE=localhost/deepseek-harness:ci
      - name: Smoke test the built image
        run: |
          # The entrypoint must fail closed (refuse to start) when it cannot
          # resolve a usable container IP, rather than binding a wildcard.
          out=$(docker run --rm --network none localhost/deepseek-harness:ci web 2>&1 || true)
          echo "$out"
          if ! echo "$out" | grep -q 'refusing to start'; then
            echo "::error::entrypoint did not fail closed without a network"; exit 1
          fi
          docker run --rm localhost/deepseek-harness:ci --version
      - name: Verify base-image digest pin is current
        run: make digest-check CONTAINERFILE=Containerfile
      # The egress policy lives in two places (Makefile + podman-compose.yml);
      # assert they still agree, and that the CLI network targets are wired to
      # the reconciling helper rather than the old create-only form. Static:
      # needs no daemon, so it runs before the build job's networks exist.
      - name: Verify egress policy is consistent
        run: make netpolicy
